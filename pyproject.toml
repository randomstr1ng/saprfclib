[build-system]
requires = ["hatchling>=1.21,<1.33", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "saprfclib"
dynamic = ["version"]
requires-python = ">=3.12"
description = "Pure Python SAP RFC protocol implementation — zero native dependencies"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Julian Petersohn", email = "julian@petersohn.it" },
]
keywords = ["sap", "rfc", "abap", "nwrfc", "protocol", "pure-python", "erp", "s4hana"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# wsproto + h11 are CORE deps per D-27 (wRFC transport imports them unconditionally).
# There are NO [ws] / [snc] / [all] optional extras — test_packaging.py enforces this.
dependencies = [
    "wsproto>=1.2",
    "h11>=0.16",
]

[project.urls]
Homepage = "https://github.com/randomstr1ng/saprfclib"
Repository = "https://github.com/randomstr1ng/saprfclib"
Documentation = "https://randomstr1ng.github.io/saprfclib/"
Issues = "https://github.com/randomstr1ng/saprfclib/issues"
Changelog = "https://github.com/randomstr1ng/saprfclib/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6",
    "mypy>=2.0",
    "ruff>=0.5",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=1.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/saprfclib/_version.py"

# ---------------------------------------------------------------------------
# Hatch environment definitions
# ---------------------------------------------------------------------------

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
test-cov = "pytest --cov=saprfclib {args}"

[tool.hatch.envs.lint]
detached = true
dependencies = [
    "mypy>=2.0",
    "ruff>=0.5",
]

[tool.hatch.envs.lint.scripts]
check = ["ruff check src tests", "ruff format --check src tests"]
fmt = ["ruff check --fix src tests", "ruff format src tests"]
type = "mypy src"

[tool.hatch.envs.docs]
features = ["docs"]

[tool.hatch.envs.docs.scripts]
build = "mkdocs build --strict"
serve = "mkdocs serve"
deploy = "mkdocs gh-deploy --force"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Pinned to the scope pytest-asyncio announces as its future default, so the
# behaviour does not change under us on an upgrade (and -W error stays usable).
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires a live SAP system (set SAPRFC_ASHOST and other SAPRFC_* env vars)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "T20"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]


[tool.coverage.run]
source = ["saprfclib"]
branch = true

[tool.coverage.report]
# The floor is the level the offline suite actually reaches today, not an
# aspiration. Set here so coverage cannot quietly fall: a change that deletes
# tests, or adds a large untested branch, fails CI instead of passing silently.
#
# branch = true above makes this stricter than a statement-only figure: the same
# suite reads 74% by statements and 72% by branches, because a great deal of the
# uncovered code is error handling reached only when something goes wrong. Those
# are precisely the paths this project keeps finding bugs in, so the stricter
# measure is the useful one.
#
# Raise it when real coverage rises. Do not lower it to make a build green --
# that converts the guard into a rubber stamp, which is worse than not having it.
#
# There is one legitimate reason to lower it: adding code that genuinely cannot be
# covered offline, such as a new SNC or WebSocket path needing a live system. That
# is a real trade, not an excuse, so it belongs in the commit message alongside the
# change -- "lowered to N because X can only be exercised against a live system".
# An adjustment with no such reason attached is the rubber stamp this guards
# against. The margin above the floor is deliberately thin so the question gets
# asked rather than drifting unnoticed.
#
# Not all of the remainder is reachable offline. snc.py needs a GSS library and an
# SNC-configured system; ws.py needs a live WebSocket RFC endpoint. Between them
# that is roughly 220 statements, so the offline ceiling is meaningfully below
# 100 and the measured figure should be read with that in mind rather than as a
# quality score. The number that matters is the trend and the floor, not the
# absolute.
fail_under = 78.5
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
