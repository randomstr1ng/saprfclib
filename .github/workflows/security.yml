name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"   # Weekly Monday 06:00 UTC — catch new CVEs without code change

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy (dependency CVEs + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        # A pinned release, checked against the SHA-256 published in that release's
        # checksums file, instead of an installer script from a moving branch that
        # installs whatever release is newest. Bump TRIVY_VERSION and TRIVY_SHA256
        # together: Dependabot does not update these.
        env:
          TRIVY_VERSION: "0.76.2"
          TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sfLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          sudo tar -xzf "$RUNNER_TEMP/$tarball" -C /usr/local/bin trivy
          trivy --version

      - name: Dependency vulnerability scan (HIGH/CRITICAL)
        # Scans pyproject.toml / requirements / installed packages for known CVEs.
        # OSV + NVD + GitHub Advisory DB. Exit 1 on any HIGH or CRITICAL finding.
        run: |
          trivy fs \
            --scanners vuln \
            --pkg-types library \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            .

      - name: Secret scan
        # Detects hardcoded credentials, API keys, private keys in source tree.
        # Any finding fails the build — credentials must never be committed.
        run: |
          trivy fs \
            --scanners secret \
            --exit-code 1 \
            --format table \
            .

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        # Exact versions with hashes (.github/requirements/semgrep.txt), so a new
        # upstream release cannot run here unreviewed.
        run: 'pip install --require-hashes --only-binary=:all: -r .github/requirements/semgrep.txt'

      - name: SAST scan
        # p/python      — Python security rules (dangerous builtins, injection, etc.)
        # p/secrets     — hardcoded credential patterns (belt-and-suspenders vs Trivy)
        # p/trailofbits — Trail of Bits crypto/protocol rules (relevant for RFC wire code)
        # --error: any finding → exit 1. Suppress false positives inline with # nosemgrep.
        run: |
          semgrep \
            --config p/python \
            --config p/secrets \
            --config p/trailofbits \
            --error \
            --no-rewrite-rule-ids \
            src/ tests/

  zizmor:
    name: Zizmor (GitHub Actions workflow audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Audit workflows
        # GH_TOKEN enables zizmor's online audits — notably impostor-commit
        # detection, which verifies that a pinned SHA actually belongs to the
        # action's repository. Without it those audits are skipped, which is
        # precisely the risk that pinning by SHA introduces.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install --require-hashes --only-binary=:all: -r .github/requirements/zizmor.txt
          zizmor --persona=regular .github/workflows/
