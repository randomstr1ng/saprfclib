name: Publish

# Tag-driven release. hatch-vcs derives the version from the tag, so the tag is the
# single source of truth — never hand-edit a version string.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Uploads use PyPI Trusted Publishing (OIDC). No API token is stored in this repo.
#
# Nothing is uploaded unless all of these hold:
#   - the run is for a tag vX.Y.Z (optionally aN / bN / rcN), also when started by hand;
#   - the tag points at exactly the checked-out commit, and that commit is on main;
#   - the full CI workflow (every OS and Python version, docs build) passes on it;
#   - the built wheel and sdist carry exactly the tag's version, and the wheel installs
#     and imports in a clean environment.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify the release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag is vX.Y.Z, names this commit, and is on main
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "::error::A release runs from a tag. Started for $REF_TYPE '$TAG', which hatch-vcs would build as a development version."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z (optionally followed by aN, bN or rcN)."
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag '$TAG' points at $tag_commit, but this run checked out $GITHUB_SHA."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points at a commit that is not on main."
            exit 1
          fi
          echo "Release tag $TAG: commit $GITHUB_SHA, on main."

  ci:
    name: Full CI
    needs: verify
    # zizmor suggests a newer self-repository form; "./" is GitHub's documented syntax
    # for a reusable workflow in the same repository and commit, so it stays.
    uses: ./.github/workflows/ci.yml  # zizmor: ignore[self-repository]
    permissions:
      contents: read

  build:
    needs: [verify, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Hatch
        run: 'pip install --require-hashes --only-binary=:all: -r .github/requirements/hatch.txt'

      - name: Build wheel + sdist
        run: hatch build

      - name: Built files carry exactly the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          ls -l dist/
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [[ ${#wheels[@]} -ne 1 || ${#sdists[@]} -ne 1 ]]; then
            echo "::error::Expected one wheel and one sdist, found ${#wheels[@]} and ${#sdists[@]}."
            exit 1
          fi
          if [[ "${wheels[0]}" != "dist/saprfclib-${version}-py3-none-any.whl" ]]; then
            echo "::error::Wheel is ${wheels[0]}, expected version ${version}."
            exit 1
          fi
          if [[ "${sdists[0]}" != "dist/saprfclib-${version}.tar.gz" ]]; then
            echo "::error::Sdist is ${sdists[0]}, expected version ${version}."
            exit 1
          fi

      - name: Wheel installs and imports in a clean environment
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install --disable-pip-version-check dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" - <<'PY'
          import os
          import saprfclib
          import saprfclib.pse
          import saprfclib.secgss

          expected = os.environ["TAG"].removeprefix("v")
          assert saprfclib.__version__ == expected, (saprfclib.__version__, expected)
          print("saprfclib", saprfclib.__version__)
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/saprfclib
    permissions:
      id-token: write          # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi              # protect with a required reviewer in repo settings
      url: https://pypi.org/p/saprfclib
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    needs: pypi
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      # `gh` ships on the runner, so no third-party action is needed in the
      # release path. One less dependency to trust on a job that has write
      # access to the repository.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes
