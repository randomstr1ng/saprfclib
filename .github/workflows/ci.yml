name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # required for hatch-vcs git-tag version derivation
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        run: pip install hatch "hatchling>=1.21,<1.32"

      - name: Lint (Ruff)
        run: hatch run lint:check

      - name: Type-check (mypy)
        run: hatch run lint:type

      - name: Test (pytest — offline only, no live SAP)
        run: hatch run test -m "not integration"

      - name: Build distribution
        run: hatch build

      - name: Verify importable wheel
        run: |
          pip install dist/*.whl --force-reinstall
          python -c "import saprfclib; print(saprfclib.__version__)"

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hatch
        run: pip install hatch "hatchling>=1.21,<1.32"

      - name: Build docs (strict)
        run: hatch run docs:build
