name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # The library is pure Python, including the built-in SNC mechanism and its
          # dependencies; run the offline suite on Windows and macOS too.
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.14"
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # required for hatch-vcs git-tag version derivation
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        run: pip install hatch "hatchling>=1.21,<1.33"

      - name: Lint (Ruff)
        run: hatch run lint:check

      - name: Type-check (mypy)
        run: hatch run lint:type

      - name: Test (pytest — offline only, no live SAP)
        run: hatch run test -m "not integration" --cov --cov-report=term-missing

      - name: Build distribution
        run: hatch build

      - name: Verify importable wheel
        run: |
          pip install dist/*.whl --force-reinstall
          python -c "import saprfclib.secgss, saprfclib.pse"
          python -c "import saprfclib; print(saprfclib.__version__)"

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Hatch
        run: pip install hatch "hatchling>=1.21,<1.33"

      - name: Build docs (strict)
        run: hatch run docs:build
